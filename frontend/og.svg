<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Share card (OG / Twitter), 1200x630. The source of truth; og.png is a raster of
    this file, because most social scrapers will not render an SVG preview. Re-render
    after any edit here (headless Chrome at 1200x630 — Inter is not a system font, so
    ImageMagick alone renders the type wrong).

    Palette and composition track the dark hero in frontend/index.html: black ground,
    the indigo wash from the top-left, the emerald wash from the top-right, the ring +
    bolt lockup, and the hero headline with "home?" in emerald.
  -->
  <defs>
    <radialGradient id="indigo-wash" cx="0.12" cy="-0.2" r="1.05">
      <stop offset="0" stop-color="#101a59" stop-opacity="0.7"/>
      <stop offset="0.62" stop-color="#101a59" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emerald-wash" cx="0.88" cy="-0.1" r="0.8">
      <stop offset="0" stop-color="#00ca8e" stop-opacity="0.1"/>
      <stop offset="0.58" stop-color="#00ca8e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#000000"/>
  <rect width="1200" height="630" fill="url(#indigo-wash)"/>
  <rect width="1200" height="630" fill="url(#emerald-wash)"/>

  <!-- lockup: the ring + bolt mark, then the wordmark -->
  <g transform="translate(80 78)">
    <circle cx="21" cy="21" r="20" fill="rgba(0,202,142,0.12)" stroke="#00ca8e" stroke-width="2.5"/>
    <g transform="translate(9.4 9.4) scale(0.97)">
      <path fill="#00ca8e" d="M14.615 1.595a.75.75 0 0 1 .359.852L12.982 9.75h7.268a.75.75 0 0 1 .548 1.262l-10.5 11.25a.75.75 0 0 1-1.272-.71l1.992-7.302H3.75a.75.75 0 0 1-.548-1.262l10.5-11.25a.75.75 0 0 1 .913-.143Z"/>
    </g>
    <text x="56" y="30" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.6" fill="#00ca8e">notavibe</text>
  </g>

  <!-- headline: the prototype's front-door tagline, over two lines -->
  <text font-family="Inter, system-ui, -apple-system, sans-serif" font-size="76" font-weight="700" letter-spacing="-2.3" fill="#ffffff">
    <tspan x="80" y="308">Ranked on maintenance,</tspan>
    <tspan x="80" y="392" fill="#00ca8e">not popularity.</tspan>
  </text>

  <!-- lead -->
  <text x="80" y="462" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="26" font-weight="500" letter-spacing="-0.3" fill="#b2b6bd">Five sourced signals, transparent bands, no composite score.</text>

  <!-- emerald hairline, bottom edge -->
  <rect x="80" y="556" width="120" height="3" rx="1.5" fill="#00ca8e"/>
</svg>
