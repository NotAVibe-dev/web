<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="notavibe">
  <title>notavibe</title>
  <!--
    The mark is a logical NOT (¬) — "not a vibe", said in one glyph.

    Two deliberate departures from the source file in ~/Documents/work/notavibe/logo:
      · the stroke is #00ca8e, the site's own emerald token, not the source's #31E29B.
        The brief is to keep the site's colours and bring the logo to them, so the
        mark matches the buttons and links it sits beside.
      · a tile rather than a transparent ground, so the glyph has guaranteed
        contrast whatever colour the browser paints behind a favicon.

    Stroke is 4/32 rather than the 2.5/24 of the full-size mark: at 16px the
    thinner weight disappears.
  -->
  <rect width="32" height="32" rx="7" fill="#0C0F0E"/>
  <path d="M7 13 H 24 V 21" stroke="#00ca8e" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
