<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="notavibe">
  <title>notavibe</title>
  <!--
    The header lockup's mark, scaled up: the emerald ring from .logo-ring with the
    Heroicons bolt inside it (frontend/index.html). Transparent ground on purpose —
    emerald #00ca8e carries enough contrast to read on both a light and a dark tab
    bar, so one file serves both without a prefers-color-scheme branch.
  -->
