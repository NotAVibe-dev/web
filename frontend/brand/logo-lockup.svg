<svg width="113" height="32" viewBox="0 0 113 32" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="notavibe">
  <title>notavibe</title>
  <!--
    The lockup for DARK surfaces. See logo-lockup-light.svg for the other.

    "nota" takes the ink, "vibe" the muted step — the green NOT plus a dimmed
    "vibe" is what makes it read as the statement rather than as decoration.

    The wordmark is OUTLINED, not live text: these are the real Inter SemiBold
    glyph contours, so the file renders identically everywhere and depends on no
    font being installed or downloaded. Inter is the site's own interface face,
    so the lockup and the site chrome are the same letterforms.

    Regenerate with fontTools if the wordmark changes: Inter SemiBold (SIL OFL)
    at 19px, tracking -0.4, baseline y=22.5, mark at x=6.

    Inks are the site's own tokens, so the lockup cannot drift from the chrome
    beside it. Colours are baked rather than inherited on purpose: an SVG loaded
    through an <img> tag is an isolated document and cannot see the host page's
    currentColor.
  -->
