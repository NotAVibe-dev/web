name: Deploy to GitHub Pages

# One repo, one domain (notavibe.dev), one site: the static site in ./frontend,
# served as-is with no build step. The Astro landing and the splash placeholder
# that used to live here are gone, so there is nothing left to choose between.
#
# A push to main that touches ./frontend (or this workflow) ships it.
# workflow_dispatch is there for a re-deploy without a code change.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history: the sitemap's lastmod comes from each page's own last
      # commit, and a shallow checkout would report the deploy commit for all
      # of them — a fabricated date dressed up as a real one.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/configure-pages@v6

      # Stamp the commit SHA onto every local asset URL in EVERY page so a deploy
      # always busts Cloudflare's edge cache. Measured at the edge: .js/.css come
      # back max-age=14400 (4h, cached at the edge too), while HTML is max-age=600
      # and cf-cache-status: DYNAMIC. So a deploy ships new HTML that still points
      # at asset URLs the edge answers from its 4h-old copy — new page, old code.
      # A ?v=<sha> query string changes the cache key, so there is nothing to hit.
      #
      # Every .html under frontend/ is rewritten, not just the front page. This
      # step used to hardcode frontend/index.html, from when that file WAS the
      # whole app; prototype.html and privacy/ have since become their own pages
      # loading the same shared scripts/ and design-system/ assets, and a page
      # left unstamped keeps serving whatever the edge already had.
      #
      # The rewrite touches the uploaded artifact, never the repo, so no ?v= is
      # ever committed and nothing needs bumping by hand (see #16, #24).
      - name: Cache-bust frontend asset URLs
        env:
          SHA: ${{ github.sha }}
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const v = (process.env.SHA || "dev").slice(0, 12);
            const files = fs.readdirSync("frontend", { recursive: true })
              .map((p) => path.join("frontend", p))
              .filter((p) => p.endsWith(".html"));
            if (!files.length) {
              console.error("no HTML found under frontend/ — refusing to deploy an empty site");
              process.exit(1);
            }
            let total = 0;
            for (const f of files) {
              let n = 0;
              const out = fs.readFileSync(f, "utf8").replace(
                /(src|href)="([^"]+?\.(?:js|css))(\?[^"]*)?"/g,
                (m, attr, p) => {
                  if (/^(https?:)?\/\//.test(p)) return m; // leave external URLs alone
                  n++;
                  return attr + "=\"" + p + "?v=" + v + "\"";
                }
              );
              fs.writeFileSync(f, out);
              total += n;
              console.log(f + ": " + n + " ref(s)");
            }
            console.log("cache-busted " + total + " local asset refs across " + files.length + " page(s) with ?v=" + v);
          '
      # The sitemap is generated, not committed — see the script's header for why,
      # and for the noindex / canonical / lastmod rules it follows. It lives in a
      # file rather than inline because its regexes do not survive shell quoting.
      - name: Generate sitemap.xml
        run: node .github/scripts/generate-sitemap.js

      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
