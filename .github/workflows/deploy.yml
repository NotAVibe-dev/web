name: Deploy to GitHub Pages

# One repo, one domain (notavibe.dev), one site: the static site in ./frontend,
# served as-is with no build step. The Astro landing and the splash placeholder
# that used to live here are gone, so there is nothing left to choose between.
#
# A push to main that touches ./frontend (or this workflow) ships it.
# workflow_dispatch is there for a re-deploy without a code change.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # Stamp the commit SHA onto every local asset URL in index.html so a
      # deploy always busts Cloudflare's 4h edge cache (assets are max-age=14400;
      # index.html is served fresh). No manual version bumping, no CF API needed.
      - name: Cache-bust frontend asset URLs
        env:
          SHA: ${{ github.sha }}
        run: |
          node -e '
            const fs = require("fs");
            const f = "frontend/index.html";
            const v = (process.env.SHA || "dev").slice(0, 12);
            let n = 0;
            const out = fs.readFileSync(f, "utf8").replace(
              /(src|href)="([^"]+?\.(?:js|css))(\?[^"]*)?"/g,
              (m, attr, path) => {
                if (/^(https?:)?\/\//.test(path)) return m; // leave external URLs alone
                n++;
                return attr + "=\"" + path + "?v=" + v + "\"";
              }
            );
            fs.writeFileSync(f, out);
            console.log("cache-busted " + n + " local asset refs with ?v=" + v);
          '
      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
