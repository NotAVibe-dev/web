name: Deploy to GitHub Pages

# One repo, one domain (notavibe.dev). Three sites live here:
#   frontend : the static VoltAgent/HashiCorp prototype in ./frontend -> served as-is
#   landing  : the full Astro site at the repo root      -> built to ./dist
#   splash   : the static placeholder in ./splash          -> served as-is
#
# Auto-deploy: a push to main that touches the frontend (or this workflow)
# ships it to notavibe.dev. workflow_dispatch stays for on-demand deploys and
# for publishing landing/splash instead. The build job resolves a `push` event
# to the frontend site.
on:
  workflow_dispatch:
    inputs:
      site:
        description: "Which site to deploy? (defaults to frontend)"
        required: true
        type: choice
        default: frontend
        options:
          - frontend
          - landing
          - splash
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve which site to deploy
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            SITE=frontend           # auto-deploy target once the push trigger is enabled
          else
            SITE="${{ inputs.site }}"
          fi
          case "$SITE" in
            frontend|landing|splash) ;;
            *) echo "::error::Unexpected site '$SITE' (expected frontend, landing or splash)."; exit 1 ;;
          esac
          echo "site=$SITE" >> "$GITHUB_OUTPUT"
          echo "Deploying **$SITE** to notavibe.dev." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v6

      # --- frontend: static prototype (no build) ---
      # Stamp the commit SHA onto every local asset URL in index.html so a
      # deploy always busts Cloudflare's 4h edge cache (assets are max-age=14400;
      # index.html is served fresh). No manual version bumping, no CF API needed.
      - name: Cache-bust frontend asset URLs
        if: steps.pick.outputs.site == 'frontend'
        env:
          SHA: ${{ github.sha }}
        run: |
          node -e '
            const fs = require("fs");
            const f = "frontend/index.html";
            const v = (process.env.SHA || "dev").slice(0, 12);
            let n = 0;
            const out = fs.readFileSync(f, "utf8").replace(
              /(src|href)="([^"]+?\.(?:js|css))(\?[^"]*)?"/g,
              (m, attr, path) => {
                if (/^(https?:)?\/\//.test(path)) return m; // leave external URLs alone
                n++;
                return attr + "=\"" + path + "?v=" + v + "\"";
              }
            );
            fs.writeFileSync(f, out);
            console.log("cache-busted " + n + " local asset refs with ?v=" + v);
          '
      - name: Upload frontend artifact
        if: steps.pick.outputs.site == 'frontend'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./frontend

      # --- landing: build the Astro site (repo root) -> ./dist ---
      - name: Set up Node
        if: steps.pick.outputs.site == 'landing'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Build landing
        if: steps.pick.outputs.site == 'landing'
        run: |
          npm ci
          npm run build
      - name: Upload landing artifact
        if: steps.pick.outputs.site == 'landing'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      # --- splash: static placeholder (no build) ---
      - name: Upload splash artifact
        if: steps.pick.outputs.site == 'splash'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./splash

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
